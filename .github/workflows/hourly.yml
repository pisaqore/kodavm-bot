name: hourly-stats
on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats and compute autopilot mode
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          LAUNCH_DATE: ${{ vars.LAUNCH_DATE }}   # e.g. 2026-10-30
          PAUSE: ${{ vars.PAUSE }}               # "true" = kill switch
        run: python scripts/fetch_stats.py
      - name: Commit data
        run: |
          git config user.name "kodavm-bot"
          git config user.email "bot@kodavm.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: hourly snapshot"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 3
          done
          exit 1
