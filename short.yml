name: make-short
on:
  workflow_dispatch:      # manual test first; scheduling comes after the sample looks right

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core ffmpeg
          pip install pillow piper-tts
      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en_US-lessac-medium
      - name: Download voice
        run: python -m piper.download_voices en_US-lessac-medium --data-dir voices
      - name: Make Short
        run: python scripts/make_short.py
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: out/short_*
